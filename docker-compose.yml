services:
  # ── Base de datos ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: financeapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     financeapp
      POSTGRES_PASSWORD: financeapp123
      POSTGRES_DB:       financeapp_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U financeapp -d financeapp_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financeapp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@financeapp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile.dev
    container_name: financeapp_backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/src        # hot reload de código
      - ./backend/prisma:/app/prisma  # hot reload de schema
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
